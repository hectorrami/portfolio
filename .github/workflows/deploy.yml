name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main  

permissions:
  contents: write  # Needed to push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Replace gh-pages with a single commit each deploy instead of
          # appending. Without this the branch accumulates every past bundle
          # and image forever — it had grown to 21 MB of dead build output.
          force_orphan: true
