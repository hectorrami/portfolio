name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # Needed to push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # `npm test` starts vitest in watch mode; `vitest run` executes once and
        # exits non-zero on failure, which is what gates the deploy.
        run: npx vitest run

      - name: Build project
        run: npm run build
        env:
          # Raises the GitHub API rate limit for scripts/fetch-repos.mjs from 60
          # to 5000 requests/hour. The build still succeeds without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Replace gh-pages with a single commit each deploy instead of
          # appending. Without this the branch accumulates every past bundle
          # and image forever — it had grown to 21 MB of dead build output.
          force_orphan: true
