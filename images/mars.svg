<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <!-- Deep-space background: reads correctly against both the light and dark
       page themes, so no prefers-color-scheme branch is needed here. -->
  <rect width="640" height="350" fill="#0b1120" rx="12"/>

  <!-- starfield -->
  <g fill="#e4e4e7">
    <circle cx="52" cy="46" r="1.6" opacity=".85"/>
    <circle cx="118" cy="92" r="1.1" opacity=".55"/>
    <circle cx="196" cy="38" r="1.8" opacity=".9"/>
    <circle cx="268" cy="104" r="1.2" opacity=".5"/>
    <circle cx="336" cy="52" r="1.5" opacity=".75"/>
    <circle cx="86" cy="168" r="1.3" opacity=".6"/>
    <circle cx="146" cy="252" r="1.1" opacity=".45"/>
    <circle cx="392" cy="196" r="1.4" opacity=".7"/>
    <circle cx="470" cy="292" r="1.6" opacity=".8"/>
    <circle cx="556" cy="238" r="1.2" opacity=".5"/>
    <circle cx="604" cy="292" r="1.4" opacity=".65"/>
    <circle cx="596" cy="60" r="1.1" opacity=".45"/>
    <circle cx="418" cy="304" r="1" opacity=".4"/>
    <circle cx="64" cy="298" r="1.2" opacity=".5"/>
  </g>

  <!-- Mars -->
  <circle cx="502" cy="106" r="64" fill="#d2601a"/>
  <path d="M502 42a64 64 0 0 1 0 128 64 64 0 0 0 0-128z" fill="#000" opacity=".16"/>
  <g fill="#a8410f" opacity=".65">
    <ellipse cx="476" cy="82" rx="19" ry="13"/>
    <ellipse cx="520" cy="126" rx="14" ry="10"/>
    <ellipse cx="486" cy="135" rx="9" ry="6"/>
  </g>
  <ellipse cx="474" cy="66" rx="13" ry="8" fill="#f0a06a" opacity=".5"/>

  <!-- trajectory, passing through the rocket on its way to Mars -->
  <path d="M96 306C170 284 300 236 438 150" fill="none" stroke="#52525b"
        stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round"/>

  <!-- rocket, climbing toward Mars; flame sits behind body and fins -->
  <g transform="translate(226 250) rotate(38)">
    <path d="M-13 40 0 98 13 40Z" fill="#fb923c"/>
    <path d="M-6 40 0 74 6 40Z" fill="#fde68a"/>
    <path d="M-22 6-45 47-22 41Z" fill="#e11d48"/>
    <path d="M22 6 45 47 22 41Z" fill="#e11d48"/>
    <path d="M0-74 22-30 -22-30Z" fill="#e11d48"/>
    <rect x="-22" y="-30" width="44" height="72" fill="#fafafa" rx="3"/>
    <rect x="-22" y="14" width="44" height="8" fill="#d4d4d8"/>
    <circle cx="0" cy="-8" r="10" fill="#0b1120"/>
    <circle cx="0" cy="-8" r="6.5" fill="#7dd3fc"/>
  </g>

  <!-- callout, placed clear of Mars -->
  <circle cx="272" cy="272" r="3" fill="#a1a1aa"/>
  <line x1="272" y1="272" x2="322" y2="272" stroke="#a1a1aa" stroke-width="1.5"/>
  <rect x="322" y="259" width="120" height="26" rx="13" fill="#18181b" stroke="#3f3f46"/>
  <text x="382" y="276" font-size="13" font-weight="600" fill="#fafafa"
        text-anchor="middle" letter-spacing="1.2">MARS BOUND</text>

  <text x="24" y="330" font-size="12" fill="#71717a">Destination: priced in. Arrival: unscheduled.</text>
</svg>
